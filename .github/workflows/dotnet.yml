name: Build and deploy .NET app to Azure Web App - virtuous-curation

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install React dependencies
      working-directory: ./mychatapp.client
      run: npm ci

    - name: Build React app
      working-directory: ./mychatapp.client
      run: npm run build

    - name: Copy React build to wwwroot
      run: |
        rm -rf ./MyChatApp.Server/wwwroot
        mkdir -p ./MyChatApp.Server/wwwroot
        cp -a ./temp-client-build/. ./MyChatApp.Server/wwwroot/

    - name: Debug wwwroot contents
      run: ls -R ./MyChatApp.Server/wwwroot

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build .NET solution
      run: dotnet build MyChatApp.sln --configuration Release

    - name: Publish .NET project
      run: dotnet publish MyChatApp.Server/MyChatApp.Server.csproj --configuration Release --output ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'virtuous-curation'
        package: ./publish
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
