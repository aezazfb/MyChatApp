name: Build and deploy .NET app to Azure Web App - virtuous-curation

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 📦 Checkout the repository
    - uses: actions/checkout@v3

    # 🟦 Set up Node.js 22 for React/Vite
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    # 📥 Install React dependencies
    - name: Install React dependencies
      working-directory: ./mychatapp.client
      run: npm ci

    # ⚙️ Build React app with Vite
    - name: Build React app
      working-directory: ./mychatapp.client
      run: npm run build

    # 🗂️ Copy Vite output (dist/) to .NET wwwroot
    - name: Copy React build to wwwroot
      run: |
        mkdir -p ./MyChatApp.Server/wwwroot
        rm -rf ./MyChatApp.Server/wwwroot/*
        cp -r ./mychatapp.client/dist/* ./MyChatApp.Server/wwwroot/

    # 🟪 Set up .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 🛠️ Build the .NET solution
    - name: Build with dotnet
      run: dotnet build MyChatApp.sln --configuration Release

    # 📦 Publish the .NET backend to ./publish
    - name: Publish
      run: dotnet publish MyChatApp.Server/MyChatApp.Server.csproj --configuration Release --output ./publish

    # 🚀 Deploy to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'virtuous-curation'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: ./publish
