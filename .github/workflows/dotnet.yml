name: Build and deploy .NET app to Azure Web App - virtuous-curation

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # ✅ Node.js setup for React frontend
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'  # Match your React app's Node version

    # ✅ Install React app dependencies
    - name: Install React dependencies
      working-directory: ./ClientApp
      run: npm ci

    # ✅ Build React app
    - name: Build React app
      working-directory: ./ClientApp
      run: npm run build

    # 🔧 Optional: Move built frontend into .NET wwwroot if needed
    # Depends on your .csproj setup
    # Example: React output copied to wwwroot before publish
    - name: Copy React build to wwwroot
      run: |
        rm -rf ./YourProject/wwwroot/*
        cp -r ./ClientApp/build/* ./YourProject/wwwroot/

    # ✅ Continue with .NET build
    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Publish
      run: dotnet publish --configuration Release --output ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'virtuous-curation'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: ./publish
