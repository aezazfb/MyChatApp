name: Build and deploy .NET app to Azure Web App - virtuous-curation

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # ✅ Set up Node.js 22
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    # ✅ Install React dependencies
    - name: Install React dependencies
      working-directory: ./mychatapp.client
      run: npm ci

    # ✅ Build React app
    - name: Build React app
      working-directory: ./mychatapp.client
      run: npm run build

    # ✅ Copy React build output to .NET wwwroot
    - name: Copy React build to wwwroot
      run: |
        rm -rf ./MyChatApp.Server/wwwroot/*
        cp -r ./mychatapp.client/build/* ./MyChatApp.Server/wwwroot/

    # ✅ Set up .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # ✅ Build .NET backend
    - name: Build with dotnet
      run: dotnet build MyChatApp.sln --configuration Release

    # ✅ Publish .NET backend
    - name: Publish
      run: dotnet publish MyChatApp.Server/MyChatApp.Server.csproj --configuration Release --output ./publish

    # ✅ Deploy to Azure
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'virtuous-curation'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: ./publish
