name: Build and deploy ASP.Net Core app to Azure Web App - virtuous-curation

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install React dependencies
        working-directory: ./mychatapp.client
        run: npm ci

      - name: Build React app
        working-directory: ./mychatapp.client
        run: npm run build

      - name: Copy React build to wwwroot
        run: |
          if not exist MyChatApp.Server\wwwroot mkdir MyChatApp.Server\wwwroot
          xcopy mychatapp.client\dist\* MyChatApp.Server\wwwroot /E /I /Y

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build .NET app
        run: dotnet build MyChatApp.sln --configuration Release

      - name: Publish .NET app
        run: dotnet publish MyChatApp.Server/MyChatApp.Server.csproj -c Release -o "${{ env.DOTNET_ROOT }}\myapp"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}\myapp

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'virtuous-curation'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
